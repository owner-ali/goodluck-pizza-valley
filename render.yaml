# Render "Blueprint": API on the free web service plan. Database = MongoDB Atlas M0 (set MONGODB_URI yourself).
services:
  - type: web
    name: goodluck-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false          # paste your Atlas connection string in the Render dashboard
      - key: CLIENT_ORIGIN
        sync: false          # your website URL, e.g. https://goodluck.pages.dev (no trailing slash)
      - key: JWT_SECRET
        generateValue: true  # Render creates a random secret
      - key: DELIVERY_FEE
        value: "0"
